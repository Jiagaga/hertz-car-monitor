name: Hertz Inventory Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out monitor
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore previous inventory state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: hertz-state-${{ github.run_id }}
          restore-keys: hertz-state-
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Harden Hertz search click
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'monitor.mjs';
          let s = fs.readFileSync(p, 'utf8');
          const cleanOld = "const clean=s=>(s||'').replace(/\\s+/g,' ').trim();";
          const cleanNew = "const clean=s=>String(s??'').replace(/\\s+/g,' ').trim();";
          if (!s.includes(cleanOld)) throw new Error('Expected clean helper not found');
          s = s.replace(cleanOld, cleanNew);
          const apiStart = s.indexOf('function apiRows(payload){');
          const domStart = s.indexOf('async function domRows(page){');
          if (apiStart < 0 || domStart < 0 || domStart <= apiStart) throw new Error('Expected apiRows/domRows functions not found');
          const apiNew = `function apiRows(payload){\nif(!Array.isArray(payload))return[];\nreturn payload.map((x,i)=>{const car=x?.car||{},cat=x?.category||{},prices=x?.prices||{};return{id:car.model_id??cat.id??\`api-\${i}\`,name:[car.brand,car.name].filter(Boolean).join(' ')||cat.name||'',transmission:car.gear_type||'',price:prices.price_now??prices.full_price??''}}).filter(x=>x.name);\n}`;
          s = s.slice(0,apiStart) + apiNew + s.slice(domStart);
          const old = "const search=page.getByRole('button',{name:'Search',exact:true});await search.click();console.log('Clicked Search');";
          const neu = `const searchText=page.getByText('Search',{exact:true});\nlet searchClicked=false;\nfor(let i=0;i<await searchText.count();i++){const el=searchText.nth(i);if(await el.isVisible().catch(()=>false)){console.log('Search text candidate:',await el.evaluate(e=>e.outerHTML.slice(0,1200)).catch(()=>'?'));await el.click({force:true});searchClicked=true;break}}\nif(!searchClicked){const controls=page.locator('button:visible,[role="button"]:visible,a:visible,input[type="submit"]:visible,input[type="button"]:visible');for(let i=0;i<await controls.count();i++){const el=controls.nth(i);const txt=clean((await el.innerText().catch(()=>''))+' '+(await el.getAttribute('value').catch(()=>''))+' '+(await el.getAttribute('aria-label').catch(()=>'')));if(/^Search$/i.test(txt)){console.log('Search control candidate:',await el.evaluate(e=>e.outerHTML.slice(0,1200)).catch(()=>'?'));await el.click({force:true});searchClicked=true;break}}}\nif(!searchClicked)throw Error('Could not find visible Search control');\nconsole.log('Clicked Search');`;
          if (!s.includes(old)) throw new Error('Expected Search line not found');
          s = s.replace(old, neu);
          fs.writeFileSync(p, s);
          console.log('Applied Search fallback, value normalization, and top-level API parser');
          NODE
      - name: Check Hertz inventory
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: npm run check
      - name: Save current inventory state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: hertz-state-${{ github.run_id }}
      - name: Upload Hertz debug evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hertz-debug-${{ github.run_id }}
          path: |
            hertz-debug.png
            hertz-api-results.json
            state.json
          if-no-files-found: ignore
          retention-days: 3
